# Deploy a producción (Cloudflare Workers), a mano.
#
# Mergear a main NO despliega. Se juntan varios merges y se despliega una vez
# con este botón: Actions → "Deploy producción" → Run workflow.
# Guia completa: docs/deploy-cloudflare.md.
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
# - CLOUDFLARE_API_TOKEN: token con el template "Edit Cloudflare Workers".
# - CLOUDFLARE_ACCOUNT_ID: el Account ID del dashboard de Cloudflare.
# - Las variables de la app (DATABASE_URL, AUTH_SECRET, GOOGLE_CLIENT_ID...):
#   cada una como secret suelto, o todas juntas en MUNDOBL_ENV (un .env
#   completo), o una mezcla; los sueltos ganan. El build las necesita
#   (prerender contra la base, NEXT_PUBLIC_*) y el Worker las recibe como
#   secrets en el mismo deploy, así nunca quedan desfasados.

name: Deploy producción

on:
  workflow_dispatch:

# Nunca dos deploys encimados; si hay uno en curso, el nuevo espera.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'juanjparedez/mundobl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          # El generador de changelog con IA usa los ultimos 30 commits.
          fetch-depth: 30

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cargar el entorno de producción
        env:
          MUNDOBL_ENV: ${{ secrets.MUNDOBL_ENV }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        # Fuera del repo a proposito: un .env* en la raiz OpenNext lo copiaria
        # dentro del codigo del Worker. Al build le llega como variables de
        # proceso y al Worker como secrets.
        run: node scripts/prepare-production-env.mjs "$RUNNER_TEMP/build-env.json" "$RUNNER_TEMP/worker-secrets.json"

      - name: Build
        run: |
          export MUNDOBL_BUILD_SHA="$GITHUB_SHA"
          export MUNDOBL_BUILD_COMMIT_DATE="$(git show -s --format=%cI "$GITHUB_SHA")"
          node scripts/run-with-env.mjs "$RUNNER_TEMP/build-env.json" \
            node node_modules/@opennextjs/cloudflare/dist/cli/index.js build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta el secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Falta el secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx opennextjs-cloudflare deploy --secrets-file="$RUNNER_TEMP/worker-secrets.json"
          echo "Deploy listo: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar el entorno
        if: always()
        run: rm -f "$RUNNER_TEMP/build-env.json" "$RUNNER_TEMP/worker-secrets.json"
