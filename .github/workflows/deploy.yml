# Deploy a producción (Cloudflare Workers), a mano.
#
# Mergear a main NO despliega. Se juntan varios merges y se despliega una vez
# con este botón: Actions → "Deploy producción" → Run workflow.
# Guia completa: docs/deploy-cloudflare.md.
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
# - CLOUDFLARE_API_TOKEN: token con el template "Edit Cloudflare Workers".
# - CLOUDFLARE_ACCOUNT_ID: el Account ID del dashboard de Cloudflare.
# - Las variables de la app (DATABASE_URL, AUTH_SECRET, GOOGLE_CLIENT_ID...):
#   cada una como secret suelto, o todas juntas en MUNDOBL_ENV (un .env
#   completo), o una mezcla; los sueltos ganan. El build las necesita
#   (prerender contra la base, NEXT_PUBLIC_*) y el Worker las recibe como
#   secrets en el mismo deploy, así nunca quedan desfasados.

name: Deploy producción

on:
  workflow_dispatch:

# Nunca dos deploys encimados; si hay uno en curso, el nuevo espera.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'juanjparedez/mundobl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          # El generador de changelog con IA usa los ultimos 30 commits.
          fetch-depth: 30

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cargar el entorno de producción
        env:
          MUNDOBL_ENV: ${{ secrets.MUNDOBL_ENV }}
          # Cada variable de la app por nombre. Tiene que coincidir con
          # APP_KEYS de scripts/prepare-production-env.mjs (el script falla
          # si no). Nunca toJSON(secrets): GitHub lo marca como malicioso.
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ secrets.GEMINI_MODELS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN }}
          NEXT_PUBLIC_DAILYMOTION_PLAYER_ID: ${{ secrets.NEXT_PUBLIC_DAILYMOTION_PLAYER_ID }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          PROJECT_GITHUB_URL: ${{ secrets.PROJECT_GITHUB_URL }}
          PROJECT_SUPABASE_URL: ${{ secrets.PROJECT_SUPABASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_HOST: ${{ secrets.R2_PUBLIC_HOST }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUNTIME_FREEZE_AUTO_ENABLED: ${{ secrets.RUNTIME_FREEZE_AUTO_ENABLED }}
          RUNTIME_FREEZE_COOLDOWN_MS: ${{ secrets.RUNTIME_FREEZE_COOLDOWN_MS }}
          RUNTIME_FREEZE_FORCE: ${{ secrets.RUNTIME_FREEZE_FORCE }}
          RUNTIME_FREEZE_HIT_THRESHOLD: ${{ secrets.RUNTIME_FREEZE_HIT_THRESHOLD }}
          RUNTIME_FREEZE_WINDOW_MS: ${{ secrets.RUNTIME_FREEZE_WINDOW_MS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          VIMEO_ACCESS_TOKEN: ${{ secrets.VIMEO_ACCESS_TOKEN }}
          VIMEO_CLIENT_ID: ${{ secrets.VIMEO_CLIENT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        # Fuera del repo a proposito: un .env* en la raiz OpenNext lo copiaria
        # dentro del codigo del Worker. Al build le llega como variables de
        # proceso y al Worker como secrets.
        run: node scripts/prepare-production-env.mjs "$RUNNER_TEMP/build-env.json" "$RUNNER_TEMP/worker-secrets.json"

      # Pool de conexiones a la base, incluido en Workers Paid. Si el token no
      # tiene permiso, sigue sin Hyperdrive (ver el script).
      - name: Hyperdrive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-hyperdrive.mjs "$RUNNER_TEMP/build-env.json"

      - name: Build
        run: |
          export MUNDOBL_BUILD_SHA="$GITHUB_SHA"
          export MUNDOBL_BUILD_COMMIT_DATE="$(git show -s --format=%cI "$GITHUB_SHA")"
          node scripts/run-with-env.mjs "$RUNNER_TEMP/build-env.json" \
            node node_modules/@opennextjs/cloudflare/dist/cli/index.js build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta el secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Falta el secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx opennextjs-cloudflare deploy --secrets-file="$RUNNER_TEMP/worker-secrets.json"
          echo "Deploy listo: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar el entorno
        if: always()
        run: rm -f "$RUNNER_TEMP/build-env.json" "$RUNNER_TEMP/worker-secrets.json"
