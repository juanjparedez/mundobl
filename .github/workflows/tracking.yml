name: Tracking integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mundobl
          POSTGRES_PASSWORD: mundobl
          POSTGRES_DB: mundobl_replay
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U mundobl"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mundobl:mundobl@127.0.0.1:55433/mundobl_replay
      DIRECT_URL: postgresql://mundobl:mundobl@127.0.0.1:55433/mundobl_replay
      AUTH_SECRET: integration-tests-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - name: Regression tests against disposable PostgreSQL
        run: |
          set -e
          for test in tracking-backup watching-collection profile-chapters tracking-statistics tracking-insights insight-distributions progress tracking-database tracking-history series-tracking-status community-privacy community-statistics community-topics community-library community-moderation community-conversations community-metrics community-backup community-request watch-date writer-credits; do
            npx tsx "scripts/test-$test.ts"
          done
          node --import tsx scripts/test-private-tracking-routes.mjs
          node --import tsx scripts/test-info-block-privacy.mjs
          node --import tsx scripts/test-profile-watch-dates.mjs
          node --import tsx scripts/test-tracking-insights-route.mjs
          node --import tsx scripts/test-library-preferences.mjs
          node --import tsx scripts/test-runtime-jobs.mjs
          node scripts/test-news-translation.mjs
          node scripts/test-news-sources.mjs
          node scripts/test-contribution-boundary.mjs
      - name: Profile mobile regression
        run: |
          npx playwright install --with-deps chromium
          node scripts/test-dashboard-mobile-flow.mjs
          node scripts/test-profile-list-count.mjs
          node scripts/test-tracking-insights-ui.mjs
          node scripts/test-history-cards.mjs
          node scripts/test-community-statistics-ui.mjs
          node --import tsx scripts/test-community-flow.mjs
          node --import tsx scripts/test-community-library-flow.mjs
      - run: npm run build
      - name: Community against the production Next server
        env:
          AUTH_SECRET: community-full-app-test-only
          AUTH_URL: http://127.0.0.1:3223
          NEXTAUTH_URL: http://127.0.0.1:3223
          GOOGLE_CLIENT_ID: local-test-client
          GOOGLE_CLIENT_SECRET: local-test-secret
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3223 > /tmp/community-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3223/api/auth/session > /dev/null; then break; fi
            sleep 1
          done
          node --import tsx scripts/test-community-app.mjs || { cat /tmp/community-next.log; exit 1; }
