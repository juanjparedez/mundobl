name: Tracking integration
on:
  pull_request:
    # Cambios solo de texto no tocan codigo: no hace falta la corrida de ~15 min.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'market/**'
  workflow_dispatch:
# Un push nuevo al mismo PR cancela la corrida anterior.
concurrency:
  group: tracking-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mundobl
          POSTGRES_PASSWORD: mundobl
          POSTGRES_DB: mundobl_replay
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U mundobl"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mundobl:mundobl@127.0.0.1:55433/mundobl_replay
      DIRECT_URL: postgresql://mundobl:mundobl@127.0.0.1:55433/mundobl_replay
      AUTH_SECRET: integration-tests-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Misma lista que corre local: npm run test:all (scripts/test-all.mjs).
      # Incluye tipos, lint, prettier, migraciones, backup/restore, regresiones,
      # UI con Playwright, build y la app contra el servidor de produccion.
      - run: node scripts/test-all.mjs
        env:
          MUNDOBL_TEST_DB: external
      - name: Logs del servidor si algo fallo
        if: failure()
        run: cat test-results/test-all/next-start.log 2>/dev/null || true
