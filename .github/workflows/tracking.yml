name: Tracking integration
on:
  # Las pruebas habituales corren localmente con npm run test:all.
  # Actions queda como comprobación limpia opcional, solo a pedido.
  workflow_dispatch:
# Una ejecución manual nueva de la misma rama reemplaza la anterior.
concurrency:
  group: tracking-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTH_SECRET: integration-tests-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Con scripts: better-sqlite3 (la D1 local de las pruebas) es nativo.
      - run: npm ci
      # Misma lista que corre local: npm run test:all (scripts/test-all.mjs),
      # con una D1 local (archivo SQLite) en test-results/.
      # Incluye tipos, lint, prettier, migraciones, backup/restore, regresiones,
      # UI con Playwright, build y la app contra el servidor de produccion.
      - run: node scripts/test-all.mjs
      - name: Logs del servidor si algo fallo
        if: failure()
        run: cat test-results/test-all/next-start.log 2>/dev/null || true
