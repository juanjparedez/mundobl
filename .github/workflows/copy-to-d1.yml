# Copia los datos de Supabase (Postgres) a la D1 "mundobl".
#
# Solo LEE Supabase. En D1 reemplaza todos los datos (borra y vuelve a
# cargar), asi se puede repetir: una vez para probar y otra justo antes de
# pasar produccion a D1. Al final compara filas por tabla y falla si alguna
# no coincide.
#
# Los datos nunca quedan como artifact: el repo es publico y la copia tiene
# mails y sesiones. Solo el resumen (conteos) queda en la corrida.
#
# Secrets: DIRECT_URL o DATABASE_URL de Supabase (sueltos o dentro de
# MUNDOBL_ENV), CLOUDFLARE_API_TOKEN con
# permiso "D1: Edit" y CLOUDFLARE_ACCOUNT_ID.
#
# Cuando produccion ya este en D1 este workflow se borra junto con
# scripts/db/copy-postgres-to-sqlite.mjs.

name: Copiar Supabase a D1

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribir COPIAR: reemplaza todos los datos de la D1 mundobl'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  copy:
    if: github.repository == 'juanjparedez/mundobl' && inputs.confirm == 'COPIAR'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: 7846511e-b152-4380-945d-e1a285ce2759
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Leer Supabase en una copia SQLite
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MUNDOBL_ENV: ${{ secrets.MUNDOBL_ENV }}
        run: |
          set -o pipefail
          node scripts/db/copy-postgres-to-sqlite.mjs "$RUNNER_TEMP/copy.db" | tee "$RUNNER_TEMP/copy.txt"

      - name: Armar el SQL de carga
        run: node scripts/db/sqlite-dump.mjs "$RUNNER_TEMP/copy.db" "$RUNNER_TEMP/copy.sql" --clear

      - name: Migrar D1
        run: npx wrangler d1 migrations apply mundobl --remote

      - name: Cargar en D1
        run: npx wrangler d1 execute mundobl --remote --yes --file="$RUNNER_TEMP/copy.sql"

      - name: Comparar filas
        run: |
          set -o pipefail
          node scripts/db/compare-d1.mjs "$RUNNER_TEMP/copy.db" | tee "$RUNNER_TEMP/compare.txt"
          {
            echo '### Copia Supabase -> D1'
            echo '```'
            cat "$RUNNER_TEMP/compare.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar la copia
        if: always()
        run: rm -f "$RUNNER_TEMP"/copy.*
